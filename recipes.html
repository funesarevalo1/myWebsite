    <h3 id="wrapper3">Desserts</h3>

    <article class="page">
        <figure class="albums">
            <img src="img/smashingpumpkins2.JPG" alt="Grunge Band" title="Rock Music">
            <figcaption class="margin">
                <ul class="ulformat">
                    <br><br>
                    <li><strong>Difficulty:</strong> 7/11 <br></li>
                    <li><strong>Description:</strong> <a href="https://tastesbetterfromscratch.com/pumpkin-pie-with-caramel-pecan-topping/" title="Alternative Option"> Classic pumpkin pie.</a><br></li>
                    <li><strong>B.P.m.</strong> 20 minutes preparation (plus cooling) 1 hour 15 minutes baking <br></li>
                    <li><strong>Ingredients:<br></strong></li>
                    <li>1 tablespoon all-purpose flour <br></li>
                    <li>12 oz ready-made pie dough*<br></li>
                    <li>2 large eggs<br></li>
                    <li>1 x 15oz can puréed pumpkin<br></li>
                    <li>1 x 14oz can sweetened<br></li>
                    <li>condensed milk<br></li>
                    <li>1 teaspoon ground cinnamon<br></li>
                    <li>1/2 teaspoon ground cloves<br></li>
                    <li>1 teaspoon ground ginger<br></li>
                    <li>1/2 teaspoon ground nutmeg or 1 tablespoon pumpkin pie spice <br></li>
                    <li>A pinch of salt <br></li>
                    <li>Whipping cream (as much as you wish) <br><br></li>
                </ul>

                <strong>Method:<br></strong>
                <ol class="olformat">
                    <li>Lightly dust a clean work surface with the flour. Lay out the pie dough, and roll it until it is around 1/4 inch thick.<br></li>
                    <li>Line a 9-inch tart pan with the pie dough, and place in the fridge for 10 minutes.<br></li>
                    <li>Preheat your oven to 350 degrees F.<br></li>
                    <li>Take the tart pan out of the fridge, and line with parchment paper, then fill with baking beans.<br></li>
                    <li>Place the tart pan on the middle shelf of the oven and bake for 15 minutes.<br></li>
                    <li>Remove the baking beans and parchment paper then return the tart pan to the oven and bake for additional 10 minutes.<br></li>
                    <li>Remove the tart pan from the oven and set aside.<br></li>
                    <li>Increase the oven temperature to 450 degrees F.<br></li>
                    <li>Crack the eggs into a mixing bowl, then add the pureed pumpkin, condensed milk,
                    ground cinnamon, ground cloves, ground ginger, ground nutmeg (or pumpkin spice) and salt. Whisk the 
                    Ingredients until even in color and well combined.<br></li>
                    <li>Pour the mixture into the tart case, and gently tap the edges of the tart pan to settle the mixture.<br></li>
                    <li>Place the tart on the middle shelf of the oven and bake for 10 minutes.<br></li>
                    <li>Reduce the oven temperature to 350 degrees F, and bake for an additional 50 minutes.<br></li>
                    <li>Take the pie out of the oven, and set aside to cool for 10 minutes. Transfer the pie to the fridge, and allow to cool for at least another 15 minutes.<br></li>
                    <li>While the pie is cooling pour some whipping cream into a bowl and whisk vigorously by hand or with an electric whisk until thick.<br></li>
                    <li>Carefully remove the pumpkin pie from the pan.</li>
                </ol>
            </figcaption>
        </figure>
    
        <figure class="albums">
            <img src="img/nirvana2.JPG" alt="Grunge Band" title="Rock Music">
            <figcaption class="margin">
                <ul class="ulformat">
                    <br><br>
                    <li><strong>Difficulty:</strong> 4/11<br></li>
                    <li><strong>Description:</strong> <a href="https://bakingwithnessa.com/peach-cobbler-banana-split/" title="Alternative Option"> Baked peach and banana split with a whiskey twist.</a><br></li>
                    <li><strong>B.P.m.</strong> 40 minutes preparation 1 hour 10 minutes cooking<br></li>
                    <li><strong>Ingredients:<br></strong></li>
                    <li>4 peaches<br></li>
                    <li>3 tablespoons Scotch whiskey<br></li>
                    <li>2 limes<br></li>
                    <li>Generous 1/2 cup date nectar or golden syrup<br></li>
                    <li>31/2 oz dark chocolate<br></li>
                    <li>4 bananas<br></li>
                    <li>4 scoops of ice cream<br></li>
                    <li>Aerosol whipped cream<br></li>
                    <li><strong>Notes:<br></strong> For best results, use a whiskey aged at least 12 years.<br><br></li>
                </ul>
                
                <strong>Method: <br></strong>
                <ol class="olformat">
                    <li>Cut the peaches in half and remove the pits.<br></li>
                    <li>Place the peach halves in an ovenproof baking dish, and drizzle over the whiskey. Cut the limes in half, and squeeze the
                    juice from each half over the peaches. Place in the fridge, and leave the peaches to soak for 30 minutes.<br></li>
                    <li>Preheat the oven to 425°F.<br></li>
                    <li>Take the dish out of the fridge, and cover the peaches with the date nectar or golden syrup.<br></li>
                    <li>Place in the oven and cook for 1 hour.<br></li>
                    <li>While the peaches are baking, blitz the chocolate in the food processor until finely ground (if you don't have a food processor,
                    use a grater or finely chop the chocolate with a knife).<br></li>
                    <li>Once cooked, remove the peaches from the oven, and spoon them into a mixing bowl.<br></li>
                    <li>Tip the ground chocolate over the peaches and gently turn the mixture, being careful not to break the peaches.<br></li>
                    <li>Slice the 4 bananas in half lengthwise, and place each pair of the banana halves in a bowl. Place 2 peach halves on top of
                    each serving.<br></li>
                    <li>Divide the remaining nectar and chocolate mix between each bowl, pouring it over the banana and peaches.<br></li>
                    <li>Before serving, add a scoop of ice cream to each bowl, and aerosol whipped cream to your taste.<br></li>
                </ol> 
            </figcaption>
        </figure>
    </article>

    <h3 id="wrapper3">Mains</h3>

    <article class="page">
        <figure class="albums">
            <img src="img/limpbizkit2.JPG" alt="Grunge Band" title="Rock Music">
            <figcaption class="margin">
                <ul class="ulformat">
                    <br><br>
                    <li><strong>Difficulty:</strong> 8/11 <br></li>
                    <li><strong>Description:</strong> <a href="https://blog.thermoworks.com/rolled-brisket/" title="Alternative Option"> Rolled beef brisket.</a><br></li>
                    <li><strong>B.P.m.</strong> 10 minutes preparation 3 hours 40 minutes cooking<br></li>
                    <li><strong>Ingredients:<br></strong></li>
                    <li>packages of fajita seasoning (21/2 oz)*<br></li>
                    <li>21/4 lb beef brisket (boned and rolled)<br></li>
                    <li>2 red onions<br></li>
                    <li>1 pot of beef stock (approx. 1oz)<br></li>
                    <li><strong>Notes: Most butchers can bone and roll the brisket for you.<br><br></strong><br></li>
                </ul>
            
                <strong>Method:<br></strong>
                <ol class="olformat">
                    <li>Preheat the oven to 350°F.<br></li>
                    <li>Lay the brisket out in a casserole dish, and coat it with 1 package of fajita seasoning (11/4 oz), then rub it into all sides of the meat.<br></li>
                    <li>Place the casserole dish, uncovered, in the oven and bake for 30 minutes. While the brisket is cooking, empty
                    the second fajita package onto a large plate and set aside.<br></li>
                    <li>Once the brisket has , remove the dish from the oven. Skewer the meat with 2 forks and roll it in the second package of seasoning
                    (keeping any remaining spices for later). Return to the casserole dish and cook in the oven for an additional 30 minutes. While the brisket is
                    cooking, peel the onions and cut them into quarters.<br></li>
                    <li>Place a saucepan over medium heat, and pour in 23/4 cups of water. Add the stock and onion quarters. Bring
                    this mixture to a simmer, then reduce the heat, and cover the saucepan.<br></li>
                    <li>After the brisket has cooked, remove the casserole dish from the oven. Skewer the meat with 2 forks and roll
                    it in the remaining seasoning.<br></li>
                    <li>Pour the contents of the saucepan into the casserole dish. Add any remaining seasoning from the plate,
                    and place the meat in the center of the dish. Cover the casserole dish with a lid, and return to the oven.<br></li>
                    <li>Reduce the oven temperature to 300°F and cook for 2 hours 30 minutes.<br></li>
                    <li>Once the brisket is cooked, the casserole dish from the oven. Remove the meat from the dish and place
                    on a plate. Cover with foil and leave to rest for 10 minutes.<br></li>
                    <li>To serve, slice the beef thinly across the grain. Pour the juices and onions from
                    the casserole dish over the meat as you serve it.<br></li>
                </ol>
            </figcaption>
        </figure>

        <figure class="albums">
            <img src="img/metallica2.JPG" alt="Grunge Band" title="Rock Music">
            <figcaption class="margin">
                <ul class="ulformat">
                    <br><br>
                    <li><strong>Difficulty:</strong> 8/11<br></li>
                    <li><strong>Description:</strong> <a href="https://www.justonecookbook.com/simple-chicken-curry/" title="Alternative Option"> Traditional Japanese chicken curry.</a><br></li>
                    <li><strong>B.P.m.</strong> 10 minutes preparation 50 minutes cooking<br></li>
                    <li><strong>Ingredients:<br></strong></li>
                    <li>2 onions<br></li>
                    <li>1 potato<br></li>
                    <li>1 carrot<br></li>
                    <li>62/3 oz jar of katsu curry paste<br></li>
                    <li>2 tablespoons olive oil<br></li>
                    <li>11/8 cups basmati rice<br></li>
                    <li>1 large egg<br></li>
                    <li>2 cups panko bread crumbs<br></li>
                    <li>4 chicken breasts<br></li>
                    <li>1/3 cup rice flour<br></li>
                    <li>2/3 cup vegetable oil<br></li>
                    <li>4 teaspoons fukujinzuke (Japanese pickle), to serve<br><br></li>
                </ul>

                <strong>Method:<br></strong>
                <ol class="olformat">
                    <li>Peel and dice 1 onion. Peel the potato and carrot and cut them into large chunks.<br></li>
                    <li>Bring 13/4 cups water to a boil a saucepan.<br></li>
                    <li>Add the chopped onion, carrot, and potato to the pan. Reduce to a simmer, and cook for 20 minutes.<br></li>
                    <li>Pour in the katsu curry paste and stir. Simmer for an additional 10 minutes. While the curry is simmering, prepare
                    the chicken and the rice.<br></li>
                    <li>Peel and dice the other onion. Heat the olive oil in a second saucepan over high heat. Add the diced onion
                    and cook for 2 minutes.<br></li>
                    <li>Add the rice to the second saucepan and stir to coat the rice in the oil. Boil a kettle full of water (approx.
                    21/2 cups), then add it to the second saucepan. Reduce the heat to a simmer, cover with a lid and do not stir the rice again. Leave to cook for
                    8 minutes, then remove from the heat. Remove the curry sauce from the heat.<br></li>
                    <li>Crack the egg into a bowl,  it, then set aside.<br></li>
                    <li>Put the panko bread crumbs in a bowl and and set aside.<br></li>
                    <li>Place the chicken breast in a bowl and add 4 tablespoons of the rice flour. Turn the chicken breasts in the bowl so that they are
                    evenly coated in the flour, then pour the beaten egg over the chicken, and turn the breasts until well coated.<br></li>
                    <li>Heat the vegetable oil in  skillet over high heat for 2 minutes.<br></li>
                    <li>Take 1 chicken breast at a time, roll it in the bread crumbs, then carefully lower it into the oil using tongs.
                    Reduce the heat, and cook for 10 minutes, then turn it to cook on both sides. Repeat with the remaining breasts.<br></li>
                    <li>Divide the rice between serving plates. Slice each chicken breast into thick strips, divide the chicken
                    between the plates and pour over the curry sauce.<br></li>
                    <li>Garnish each plate with 1  of the fukujinzuke.<br></li>
                </ol>
            </figcaption>
        </figure>
    </article>
